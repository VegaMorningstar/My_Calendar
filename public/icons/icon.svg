<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe5d3"/><stop offset="1" stop-color="#ddcfb5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc7bd"/><stop offset="1" stop-color="#2f9f98"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a401c" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- the glass slab -->
  <rect x="96" y="104" width="320" height="304" rx="56" fill="url(#glass)" stroke="#fff" stroke-opacity=".85" stroke-width="3" filter="url(#shadow)"/>
  <!-- the engraved header bar -->
  <rect x="136" y="144" width="132" height="22" rx="11" fill="#48381f" fill-opacity=".34"/>
  <!-- the day grid: engraved squares, one lit teal for the day with a photo -->
  <g fill="none" stroke="#48381f" stroke-opacity=".3" stroke-width="3">
    <rect x="136" y="198" width="44" height="44" rx="12"/><rect x="190" y="198" width="44" height="44" rx="12"/><rect x="244" y="198" width="44" height="44" rx="12"/><rect x="298" y="198" width="44" height="44" rx="12"/>
    <rect x="136" y="252" width="44" height="44" rx="12"/><rect x="190" y="252" width="44" height="44" rx="12"/><rect x="298" y="252" width="44" height="44" rx="12"/>
    <rect x="136" y="306" width="44" height="44" rx="12"/><rect x="244" y="306" width="44" height="44" rx="12"/><rect x="298" y="306" width="44" height="44" rx="12"/>
  </g>
  <rect x="352" y="198" width="30" height="44" rx="12" fill="none"/>
  <rect x="244" y="252" width="44" height="44" rx="12" fill="url(#teal)"/>
  <rect x="190" y="306" width="44" height="44" rx="12" fill="#b4513f" fill-opacity=".85"/>
</svg>
