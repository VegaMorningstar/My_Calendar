<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page run under the iPhone notch; app.css pads it back with safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My Calendar</title>
    <meta name="description" content="A calendar of the photos I took, one day at a time." />

    <!-- Installable app: manifest, theme colour, and the iOS "Add to Home Screen" tags -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#e7dcc8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent lets the page run under the status bar (time, signal, battery); app.css pads content clear of it -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Calendar" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />

    <!-- Fonts are hosted with the app (src/fonts.css); preload the two used on first paint -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/PlayfairDisplay-normal-nuFiD-vYSZvi.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/DMMono-normal-aFTU7PB1QTsU.woff2" />

    <!--
      Paint the wallpaper before anything else loads. The wallpaper in use is remembered as a tiny
      blurred preview (a few KB) in localStorage, which can be read instantly, unlike the full image
      in IndexedDB. This runs before the stylesheet and the app, so the first frame already shows the
      wallpaper, and the full image fades in over it. The defaults below are filled in at build time
      from src/photo-library/default-wallpaper-meta.json (npm run default-wallpaper).
    -->
    <script>
      (function () {
        var fallback = { preview: '%DEFAULT_PREVIEW%', average: '%DEFAULT_AVERAGE%', top: '%DEFAULT_TOP%', bottom: '%DEFAULT_BOTTOM%' }
        var wp = fallback
        try {
          var saved = JSON.parse(localStorage.getItem('mycal.wallpaper'))
          if (saved && saved.preview) wp = saved
        } catch (e) {}
        // The page colour behind everything, then the preview itself, blurred so a 48px image reads as
        // frosted glass rather than blocks. It is removed once the full wallpaper has faded in (App.jsx).
        document.documentElement.style.background = wp.bottom || '#ddd'
        var early = document.createElement('div')
        early.id = 'early-wallpaper'
        early.style.cssText = 'position:fixed;top:-40px;left:-40px;right:-40px;bottom:-160px;z-index:-1;pointer-events:none;' +
          'background:url("' + wp.preview + '") center / cover no-repeat;filter:blur(14px)'
        document.documentElement.appendChild(early)
        var theme = document.querySelector('meta[name="theme-color"]')
        if (theme && wp.top) theme.setAttribute('content', wp.top)
        if (wp === fallback) {
          // Using the default wallpaper: start fetching its image now
          var link = document.createElement('link')
          link.rel = 'preload'; link.as = 'image'; link.href = '%BASE_URL%wallpaper/default.jpg'
          document.head.appendChild(link)
        }
        window.__wallpaper = wp
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
